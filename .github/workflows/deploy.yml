name: Deploy HELIOS SCADA to GitHub Pages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Production Web App
        working-directory: ./frontend
        run: npm run build

      - name: Prepare Assets & Prevent Jekyll Filtering
        run: |
          mkdir -p frontend/dist/presentation
          cp -r presentation/* frontend/dist/presentation/ 2>/dev/null || true
          cp HELIOS_ORION_1.0_Pitch_Deck.pptx frontend/dist/ 2>/dev/null || true
          # Essential for GitHub Pages to serve all assets properly
          touch frontend/dist/.nojekyll
          # Add fallback index for SPA routing if needed
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          clean: true
